name: verify
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: workbench_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://workbench:synthetic-ci-only@localhost:5432/workbench_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx next build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m workbench.identity
          python -m uvicorn workbench.api:app --host 127.0.0.1 --port 8100 > /tmp/workbench-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8100/api/health && break; sleep 1; done
          npx playwright test
      - name: Record the verified review flow
        run: |
          mkdir -p .tmp/video
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3200 > .tmp/video/web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3200/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3200/api/health
          node scripts/record-demo.mjs
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact
      - name: Backup and restore isolated database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          RESTORE_DATABASE_URL: postgresql://workbench:synthetic-ci-only@localhost:5432/workbench_restore_test
        run: |
          mkdir -p .tmp/reports
          docker exec "$PG_CONTAINER" pg_dump -U workbench -Fc workbench_test > .tmp/backup.dump
          docker exec "$PG_CONTAINER" createdb -U workbench workbench_restore_test
          docker exec -i "$PG_CONTAINER" pg_restore -U workbench -d workbench_restore_test < .tmp/backup.dump
          python scripts/verify_restore.py > .tmp/reports/restore.json
      - name: Build and smoke commit-tagged containers
        run: |
          docker build --target api -t workbench-api:${{ github.sha }} .
          docker build --target web --build-arg API_ORIGIN=http://127.0.0.1:8101 -t workbench-web:${{ github.sha }} .
          docker run -d --name workbench-api-smoke --network host -e DATABASE_URL="$DATABASE_URL" workbench-api:${{ github.sha }} python -m uvicorn workbench.api:app --host 127.0.0.1 --port 8101
          docker run -d --name workbench-web-smoke --network host -e PORT=3201 -e HOSTNAME=127.0.0.1 workbench-web:${{ github.sha }}
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3201/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3201/api/health
          curl -fsS http://127.0.0.1:3201/ > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            .tmp/reports
            .tmp/video/review-flow.webm
            .tmp/*-review.png
            test-results
          include-hidden-files: true
